<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A0F;
  --bg2:#111118;
  --bg3:#1A1A24;
  --bg4:#252532;
  --txt:#F0F4FF;
  --txt2:#C8D0E8;
  --txt3:#8892AA;
  --txt4:#5A6478;
  --sep:rgba(0,200,255,.1);
  --sepH:rgba(0,200,255,.18);
  --blue:#00C8FF;
  --blue-bg:rgba(0,200,255,.1);
  --red:#FF4560;
  --red-bg:rgba(255,69,96,.12);
  --orange:#FF9F43;
  --orange-bg:rgba(255,159,67,.12);
  --green:#00E676;
  --green-bg:rgba(0,230,118,.1);
  --purple:#C77DFF;
  --purple-bg:rgba(199,125,255,.12);
  --blur:saturate(160%) blur(24px);
  --r:16px;
  --r-sm:12px;
  --r-xs:9px;
  --bar:52px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --max:680px;
}
html,body{height:100%;width:100%;max-width:100%;font-family:var(--font);color:var(--txt);overflow-x:hidden;overflow-y:auto;background-color:#0A0A0F;background-image:linear-gradient(rgba(0,200,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.07) 1px,transparent 1px),linear-gradient(rgba(0,200,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.025) 1px,transparent 1px);background-size:80px 80px,80px 80px,20px 20px,20px 20px;background-attachment:fixed}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r-xs)}
input,select,textarea{font-family:var(--font);color:var(--txt);background:none;border:none}
input:focus,select:focus,textarea:focus{outline:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ───── Layout ───── */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;width:100%;max-width:430px;margin:0 auto;position:relative;background:transparent;z-index:1;overflow-x:hidden}
/* iPad: dos columnas */
@media(min-width:768px){
  .app{max-width:100%}
  .app-inner{display:grid;grid-template-columns:300px 1fr;height:100vh;max-width:1024px;margin:0 auto}
}



/* ───── Header ───── */
.header{padding:max(env(safe-area-inset-top),14px) 16px 12px;position:sticky;top:0;z-index:20;background:rgba(10,10,15,.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(0,200,255,.08)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header-actions{display:none}
.header-title{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.header-title span{color:var(--blue)}
.header-actions{display:flex;gap:8px}
.hbtn{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:background .15s var(--ease),transform .1s var(--ease)}
.hbtn:active{transform:scale(.9)}
.hbtn svg{width:18px;height:18px;stroke:var(--txt);stroke-width:1.8;fill:none}

/* ───── Vista switcher ───── */
.vsw{display:flex;background:rgba(0,200,255,.07);border:1px solid rgba(0,200,255,.12);border-radius:var(--r-xs);padding:2px;gap:0;margin-bottom:10px}
.vsw-btn{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;color:var(--txt4);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease);letter-spacing:-.01em}
.vsw-btn.act{background:rgba(0,200,255,.18);color:#00C8FF;box-shadow:0 1px 6px rgba(0,200,255,.2)}

/* ───── Día: tira fechas ───── */
.strip{display:flex;gap:4px;padding:10px 12px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0;-webkit-overflow-scrolling:touch;width:100%;box-sizing:border-box}
.strip::-webkit-scrollbar{display:none}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 10px;border-radius:var(--r-sm);min-width:48px;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);flex-shrink:0;border:1px solid transparent}
.day-pill:active{transform:scale(.93)}
.day-pill .dp-wk{font-size:11px;font-weight:500;color:var(--txt4);text-transform:uppercase;letter-spacing:.05em}
.day-pill .dp-num{font-size:20px;font-weight:600;line-height:1;letter-spacing:-.02em}
.day-pill .dp-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:0}
.day-pill.has-dot .dp-dot{opacity:1}
.day-pill.sel{background:rgba(0,200,255,.18);border-color:rgba(0,200,255,.4)}
.day-pill.sel .dp-wk,.day-pill.sel .dp-num{color:#00C8FF}
.day-pill.sel .dp-dot{background:#fff;opacity:.7}
.day-pill.hoy .dp-num{color:#00C8FF}
.day-pill.sel.hoy .dp-num{color:#00C8FF}

/* ───── Scroll principal ───── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(120px + env(safe-area-inset-bottom));scrollbar-width:none;width:100%}
.scroll::-webkit-scrollbar{display:none}

/* ───── Vista DÍA ───── */
.day-view{padding:12px 16px 0}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.day-label{font-size:15px;font-weight:600;color:var(--txt3)}
.day-count{font-size:13px;color:var(--txt4)}

/* ───── Grupo hora (timeline) ───── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-row{display:flex;gap:0;min-height:60px;position:relative}
.tl-time{width:46px;font-size:11px;color:var(--txt4);font-variant-numeric:tabular-nums;padding-top:2px;flex-shrink:0;text-align:right;padding-right:10px;letter-spacing:-.01em}
.tl-line{width:1px;background:var(--sep);flex-shrink:0;position:relative}
.tl-line::before{content:'';position:absolute;top:4px;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--sep)}
.tl-content{flex:1;padding:0 0 0 12px;min-height:60px;border-bottom:1px solid var(--sep)}

/* ───── Tarjeta tarea ───── */
.task-card{border-radius:var(--r-sm);padding:10px 12px;margin:4px 0;cursor:pointer;position:relative;transition:opacity .2s var(--ease),transform .15s var(--ease);border-left:3px solid transparent;background:rgba(17,17,24,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,200,255,.08);border-left:3px solid transparent}
.task-card:active{transform:scale(.98)}
.task-card.done{opacity:.5}
.task-card.done .tc-title{text-decoration:line-through}
.task-card.p-red{border-left-color:var(--red);background:var(--bg2)}
.task-card.p-orange{border-left-color:var(--orange)}
.task-card.p-blue{border-left-color:var(--blue)}
.task-card.p-green{border-left-color:var(--green)}
.task-card.p-purple{border-left-color:var(--purple)}
.task-card .tc-top{display:flex;align-items:flex-start;gap:8px}
.task-card .tc-check{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s var(--ease),border-color .2s var(--ease)}
.task-card.done .tc-check{background:var(--green);border-color:var(--green)}
.task-card.done .tc-check svg{stroke:#fff}
.task-card .tc-check svg{width:11px;height:11px;stroke:transparent;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.task-card .tc-body{flex:1;min-width:0}
.task-card .tc-title{font-size:15px;font-weight:500;line-height:1.3;overflow-wrap:break-word}
.task-card .tc-desc{font-size:13px;color:var(--txt4);margin-top:2px;line-height:1.4;overflow-wrap:break-word}
.task-card .tc-footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;border-radius:6px;padding:3px 7px;letter-spacing:.01em}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-orange{background:var(--orange-bg);color:var(--orange)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}
.tag svg{width:10px;height:10px;stroke:currentColor;stroke-width:2;fill:none}
.tc-actions{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.tc-act{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.tc-act:hover{background:var(--bg3)}
.tc-act svg{width:14px;height:14px;stroke:var(--txt4);stroke-width:2;fill:none}
.tc-act.del:hover{background:var(--red-bg)}
.tc-act.del:hover svg{stroke:var(--red)}

/* ───── Vencida indicator ───── */
.task-card.overdue{border-left-color:var(--red)!important}
.task-card.overdue::before{content:'';position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--red)}

/* ───── Vista SEMANA ───── */
.week-view{padding:8px 0 0}
.week-grid{display:flex;flex-direction:column;gap:0}
.week-day-section{padding:0 16px}
.wds-header{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.wds-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.wds-badge.hoy{background:rgba(0,200,255,.2);color:#00C8FF;border:1px solid rgba(0,200,255,.4)}
.wds-badge.past{background:var(--bg3);color:var(--txt4)}
.wds-badge.fut{background:var(--bg3);color:var(--txt)}
.wds-info{flex:1}
.wds-name{font-size:15px;font-weight:600}
.wds-name.hoy{color:var(--blue)}
.wds-count{font-size:12px;color:var(--txt4);margin-top:1px}
.wds-sep{height:1px;background:var(--sep);margin:4px 0 8px}

/* ───── Vista MES ───── */
.month-view{padding:8px 16px 0}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav-title{font-size:17px;font-weight:600;letter-spacing:-.02em}
.month-nav-btn{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center}
.month-nav-btn svg{width:14px;height:14px;stroke:var(--txt);stroke-width:2;fill:none}
.month-cal{width:100%}
.mc-wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.mc-wk-label{text-align:center;font-size:11px;color:var(--txt4);font-weight:500;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.mc-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.mc-cell{aspect-ratio:1;border-radius:var(--r-xs);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px 3px;cursor:pointer;transition:background .1s var(--ease);position:relative}
.mc-cell:active{background:var(--bg3)}
.mc-cell.other-month .mc-num{color:var(--txt4);opacity:.4}
.mc-cell .mc-num{font-size:14px;font-weight:500;line-height:1;letter-spacing:-.01em}
.mc-cell.hoy .mc-num{background:rgba(0,200,255,.25);color:#00C8FF;border:1.5px solid rgba(0,200,255,.5);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.mc-cell.sel-day{background:var(--blue-bg)}
.mc-cell.sel-day .mc-num{color:var(--blue);font-weight:700}
.mc-cell.hoy.sel-day .mc-num{background:var(--blue);color:#fff}
.mc-dots{display:flex;gap:2px;margin-top:3px;justify-content:center}
.mc-dot{width:4px;height:4px;border-radius:50%}
/* Sección de tareas del día seleccionado en mes */
.month-tasks{margin-top:16px}
.mt-header{font-size:15px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em}

/* ───── Empty state ───── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:10px;text-align:center}
.empty-icon{width:52px;height:52px;border-radius:16px;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.empty-icon svg{width:26px;height:26px;stroke:var(--txt4);stroke-width:1.5;fill:none}
.empty h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.empty p{font-size:14px;color:var(--txt4);line-height:1.5;max-width:220px}

/* ───── FAB ───── */
.fab{position:fixed;bottom:calc(32px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#0090FF,#00C8FF);box-shadow:0 0 0 1px rgba(0,200,255,.3),0 4px 24px rgba(0,200,255,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),box-shadow .15s var(--ease);z-index:30}
.fab:active{transform:scale(.92);box-shadow:0 0 0 1px rgba(0,200,255,.2),0 2px 12px rgba(0,200,255,.2)}
.fab svg{width:24px;height:24px;stroke:#fff;stroke-width:2.2;fill:none}
@media(min-width:768px){.fab{bottom:40px;right:40px}}

/* ───── Sheet modal ───── */
.sheet-bg{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s var(--ease);touch-action:none}
.sheet-bg.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:rgba(12,12,18,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px 22px 0 0;border-top:1px solid rgba(0,200,255,.15);width:100%;padding:0 0 40px;animation:slideUp .3s var(--ease);max-height:85vh;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sheet::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bg4);margin:10px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.sheet-head h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet-close{font-size:15px;font-weight:600;color:var(--blue)}
.sheet-body{padding:8px 20px 0;display:flex;flex-direction:column;gap:0;padding-bottom:env(safe-area-inset-bottom)}

/* iOS-style form groups */
.form-section{background:rgba(17,17,24,.9);border-radius:var(--r);overflow:hidden;margin-bottom:12px;border:1px solid rgba(0,200,255,.1)}
.form-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--sep);position:relative}
.form-row:last-child{border-bottom:none}
.form-row label{font-size:15px;color:var(--txt);font-weight:400;flex-shrink:0;min-width:80px}
.form-row input[type=text],.form-row input[type=date],.form-row textarea,.form-row select{flex:1;font-size:15px;color:var(--txt);text-align:right;background:transparent;caret-color:var(--blue);min-width:0}
.form-row textarea{text-align:left;resize:none;min-height:60px;padding:0}
.form-row input::placeholder{color:var(--txt4)}
.form-row input[type=date]{color-scheme:light dark}
.prio-group{display:flex;gap:8px;flex:1;justify-content:flex-end;flex-wrap:nowrap}
.prio-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:9px;border:1.5px solid transparent;font-size:12px;font-weight:500;color:var(--txt4);background:rgba(255,255,255,.04);transition:border-color .15s var(--ease),background .15s var(--ease),color .15s var(--ease),transform .1s var(--ease)}
.prio-btn:active{transform:scale(.94)}
.prio-btn.sel{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--txt)}
.prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.save-btn{display:block;width:100%;padding:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;border-radius:var(--r);letter-spacing:-.01em;transition:opacity .15s var(--ease),transform .1s var(--ease);margin-top:4px}
.save-btn:active{opacity:.85;transform:scale(.98)}
.save-btn:disabled{opacity:.4;pointer-events:none}

/* ───── Confirm sheet ───── */
.confirm-sheet{background:rgba(12,12,18,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px 22px 0 0;border-top:1px solid rgba(0,200,255,.15);width:100vw;max-width:100vw;padding:0 20px 40px;animation:slideUp .3s var(--ease)}
.cs-title{font-size:17px;font-weight:600;text-align:center;padding:20px 0 6px;letter-spacing:-.01em}
.cs-sub{font-size:14px;color:var(--txt4);text-align:center;margin-bottom:20px;line-height:1.4}
.cs-btn{display:block;width:100%;padding:14px;font-size:17px;font-weight:600;border-radius:var(--r);margin-bottom:10px;letter-spacing:-.01em;transition:opacity .15s,transform .1s}
.cs-btn:active{opacity:.8;transform:scale(.98)}
.cs-del{background:var(--red-bg);color:var(--red)}
.cs-cancel{background:var(--bg2);color:var(--blue)}

/* ───── Resumen header cards ───── */
.summary{display:flex;flex-direction:column;gap:5px;padding:4px 16px 8px;border:1px solid rgba(0,200,255,.1);border-radius:10px;padding:7px 3px 6px;text-align:center;min-width:0;overflow:hidden}
.sum-card .sc-val{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1}
.sum-card .sc-lbl{font-size:8px;color:var(--txt4);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.sc-blue{color:var(--blue)}
.sc-green{color:var(--green)}
.sc-orange{color:var(--orange)}
.sc-red{color:var(--red)}

/* ───── Progreso strip ───── */
.prog-bar{height:2px;background:rgba(0,200,255,.1);border-radius:2px;margin:0 16px 8px;overflow:hidden}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:2px;transition:width .5s var(--ease)}

/* ───── Toast ───── */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--txt);color:var(--bg);font-size:13px;font-weight:500;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Summary layout ── */
.sum-row-top{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sum-card-full{padding:10px 14px!important;min-width:0!important}
.sc-full-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sc-full-val{font-size:22px!important;font-weight:700;letter-spacing:-.03em;line-height:1}
.sc-prog-wrap{flex:1;display:flex;flex-direction:column;gap:5px}
.sc-prog-bar{height:5px;background:rgba(0,200,255,.12);border-radius:3px;overflow:hidden}
.sc-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:3px;transition:width .5s var(--ease)}
.sc-prog-label{font-size:11px;color:var(--txt4);font-weight:500}

/* iOS keyboard — evitar desplazamiento */
html{height:-webkit-fill-available}
body{min-height:-webkit-fill-available}
.sheet-bg.open{display:flex!important;position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Header -->
  <div class="header" id="header">
    <div class="header-top">
      <div class="header-title" id="headerTitle">Mi Planificador</div>
    </div>
    <div class="vsw" role="group" aria-label="Seleccionar vista">
      <button class="vsw-btn act" data-view="day" aria-pressed="true">Día</button>
      <button class="vsw-btn" data-view="week" aria-pressed="false">Semana</button>
      <button class="vsw-btn" data-view="month" aria-pressed="false">Mes</button>
    </div>
    <!-- Cards resumen -->
    <div class="summary" id="summaryCards"></div>
    <!-- Barra de progreso -->
    <div class="prog-bar"><div class="prog-bar-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <!-- Tira de días (solo vista día) -->
  <div class="strip" id="strip"></div>

  <!-- Área de scroll -->
  <div class="scroll" id="scroll"></div>

  <!-- Banner alerta in-app -->
  <div id="alertBanner" style="display:none;position:sticky;bottom:0;left:0;right:0;z-index:25;
    margin:0 12px 8px;padding:10px 14px;border-radius:12px;
    background:rgba(255,159,67,.12);border:1px solid rgba(255,159,67,.35);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    align-items:center;gap:10px;animation:slideUp .3s var(--ease)">
    <span id="alertText" style="flex:1;font-size:12.5px;font-weight:500;color:#FF9F43;line-height:1.4"></span>
    <button onclick="this.parentElement.style.display='none'" style="font-size:11px;font-weight:600;
      color:#FF9F43;background:rgba(255,159,67,.15);border:none;border-radius:7px;padding:4px 9px;cursor:pointer;flex-shrink:0">
      OK
    </button>
  </div>

  <!-- FAB -->
  <button class="fab" id="fabBtn" aria-label="Nueva tarea">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

</div><!-- /.app -->

<!-- Sheet: Nueva/Editar tarea -->
<div class="sheet-bg" id="taskSheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Nueva tarea</h2>
      <button class="sheet-close" id="sheetClose">Cancelar</button>
    </div>
    <div class="sheet-body">
      <div class="form-section">
        <div class="form-row">
          <label for="fTitulo">Título</label>
          <input type="text" id="fTitulo" placeholder="Nombre de la tarea" maxlength="120">
        </div>
        <div class="form-row">
          <label for="fDesc">Nota</label>
          <textarea id="fDesc" placeholder="Detalles opcionales…" maxlength="400" rows="2"></textarea>
        </div>
      </div>
      <div class="form-section">
        <div class="form-row">
          <label for="fFecha">Fecha</label>
          <input type="date" id="fFecha">
        </div>
        <div class="form-row">
          <label style="align-self:flex-start;padding-top:6px">Prioridad</label>
          <div class="prio-group" role="group" aria-label="Seleccionar prioridad">
            <button class="prio-btn sel" data-prio="green" aria-pressed="true"><span class="prio-dot" style="background:#00E676"></span>Baja</button>
            <button class="prio-btn" data-prio="orange" aria-pressed="false"><span class="prio-dot" style="background:#FF9F43"></span>Media</button>
            <button class="prio-btn" data-prio="red" aria-pressed="false"><span class="prio-dot" style="background:#FF4560"></span>Alta</button>
          </div>
        </div>
      </div>
      <button class="save-btn" id="saveBtn">Agregar tarea</button>
    </div>
  </div>
</div>

<!-- Sheet: Confirmar eliminar -->
<div class="sheet-bg" id="confirmSheet">
  <div class="confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="cs-title">
    <p class="cs-title" id="cs-title">Eliminar tarea</p>
    <p class="cs-sub" id="cs-sub">Esta acción no se puede deshacer.</p>
    <button class="cs-btn cs-del" id="cs-del">Eliminar</button>
    <button class="cs-btn cs-cancel" id="cs-cancel">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  Mi Planificador — iOS-style, vanilla JS
// ═══════════════════════════════════════════════════

// ── Utils ──
const $ = id => document.getElementById(id);
const qs = s => document.querySelector(s);
const qsa = s => [...document.querySelectorAll(s)];
const isoToday = () => { const d=new Date(); return fmt(d); };
const fmt = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const p2 = n => String(n).padStart(2,'0');
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const diffDays = (a,b) => Math.round((parseISO(a)-parseISO(b))/86400000);
const addDays = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return fmt(d); };
const WK=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES_LARGO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_CORTO=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const PRIO_COLORS={red:'#FF3B30',orange:'#FF9500',blue:'#007AFF',green:'#34C759',purple:'#AF52DE'};
const PRIO_NAMES={red:'Alta',orange:'Media',green:'Baja',blue:'Normal',purple:'Especial'};

// ── Estado ──
let tasks = [];
let nextId = 1;
let view = 'day';
let selDate = isoToday();
let monthOffset = 0;
let editId = null;
let deleteId = null;
let curPrio = 'green';





// ── Render maestro ──
function render(){
  renderSummary();
  renderHeader();
  if(view==='day'){ $('strip').style.display='flex'; renderStrip(); renderDayView(); }
  else if(view==='week'){ $('strip').style.display='none'; renderWeekView(); }
  else { $('strip').style.display='none'; renderMonthView(); }
  checkAlertaInApp();
}

// ── Summary cards ──
function renderSummary(){
  const today = isoToday();
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const todayPend = tasks.filter(t=>t.date===today&&!t.done).length;
  const overdue = tasks.filter(t=>diffDays(t.date,today)<0&&!t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  $('summaryCards').innerHTML = `
    <div class="sum-row-top">
      <div class="sum-card"><div class="sc-val sc-blue">${total}</div><div class="sc-lbl">Total</div></div>
      <div class="sum-card"><div class="sc-val sc-green">${done}</div><div class="sc-lbl">Hechas</div></div>
      <div class="sum-card"><div class="sc-val sc-orange">${todayPend}</div><div class="sc-lbl">Para hoy</div></div>
      <div class="sum-card"><div class="sc-val sc-red">${overdue}</div><div class="sc-lbl">Vencidas</div></div>
    </div>
    <div class="sum-card sum-card-full">
      <div class="sc-full-inner">
        <div>
          <div class="sc-val sc-full-val">${pct}%</div>
          <div class="sc-lbl">Completado</div>
        </div>
        <div class="sc-prog-wrap">
          <div class="sc-prog-bar"><div class="sc-prog-fill" style="width:${pct}%"></div></div>
          <span class="sc-prog-label">${done} de ${total} tareas</span>
        </div>
      </div>
    </div>`;
  $('progFill').style.width = pct+'%';
}

// ── Header dinámico ──
function renderHeader(){
  const d = parseISO(selDate);
  let title='Mi Planificador';
  if(view==='day'){
    const today=isoToday();
    const diff=diffDays(selDate,today);
    if(diff===0) title='Hoy';
    else if(diff===1) title='Mañana';
    else if(diff===-1) title='Ayer';
    else title=`${d.getDate()} ${MES_CORTO[d.getMonth()]}`;
  } else if(view==='week'){
    const base=getWeekStart();
    const end=addDays(base,6);
    const b=parseISO(base), e=parseISO(end);
    title=`${b.getDate()}–${e.getDate()} ${MES_CORTO[e.getMonth()]}`;
  } else {
    const now=new Date(); now.setMonth(now.getMonth()+monthOffset);
    title=`<span>${MES_LARGO[now.getMonth()]}</span> ${now.getFullYear()}`;
  }
  $('headerTitle').innerHTML=title;
}

// ── Tira días (vista Día) ──
function renderStrip(){
  const strip=$('strip');
  strip.innerHTML='';
  const today=isoToday();
  for(let i=-2;i<=14;i++){
    const iso=addDays(today,i);
    const d=parseISO(iso);
    const hasDot=tasks.some(t=>t.date===iso&&!t.done);
    const btn=document.createElement('button');
    btn.className='day-pill'+(iso===today?' hoy':'')+(iso===selDate?' sel':'')+(hasDot?' has-dot':'');
    btn.setAttribute('aria-label',`${WK[d.getDay()]} ${d.getDate()}`);
    btn.setAttribute('aria-pressed', iso===selDate?'true':'false');
    btn.innerHTML=`<span class="dp-wk">${WK[d.getDay()]}</span><span class="dp-num">${d.getDate()}</span><span class="dp-dot"></span>`;
    btn.addEventListener('click',()=>{ selDate=iso; render(); });
    strip.appendChild(btn);
  }
  // scroll para que el día seleccionado quede visible
  setTimeout(()=>{
    const active=strip.querySelector('.sel');
    if(active) active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  },50);
}

// ── Vista DÍA ──
function renderDayView(){
  const today=isoToday();
  const dayTasks=tasks.filter(t=>t.date===selDate).sort((a,b)=>PRIO_RANK(a.prio)-PRIO_RANK(b.prio));
  const scr=$('scroll');
  scr.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='day-view';
  if(!dayTasks.length){
    wrap.innerHTML=emptyHTML('Sin tareas','No hay nada programado para este día.');
  } else {
    const pending=dayTasks.filter(t=>!t.done);
    const done=dayTasks.filter(t=>t.done);
    if(pending.length){
      wrap.innerHTML+=`<div class="day-header"><span class="day-label">Pendientes</span><span class="day-count">${pending.length}</span></div>`;
      pending.forEach(t=>{ const c=makeCard(t,selDate<today); wrap.appendChild(c); });
    }
    if(done.length){
      const doneHead=document.createElement('div');
      doneHead.className='day-header';doneHead.style.marginTop='16px';
      doneHead.innerHTML=`<span class="day-label">Completadas</span><span class="day-count">${done.length}</span>`;
      wrap.appendChild(doneHead);
      done.forEach(t=>{ wrap.appendChild(makeCard(t,false)); });
    }
  }
  scr.appendChild(wrap);
}
const PRIO_RANK=p=>({red:0,orange:1,purple:2,blue:3,green:4}[p]||3);

// ── Vista SEMANA ──
function getWeekStart(){
  const d=parseISO(selDate);
  const day=d.getDay();
  const mon=new Date(d); mon.setDate(d.getDate()-day+1);
  return fmt(mon);
}
function renderWeekView(){
  const today=isoToday();
  const start=getWeekStart();
  const scr=$('scroll');
  scr.innerHTML='';
  let anyTask=false;
  for(let i=0;i<7;i++){
    const iso=addDays(start,i);
    const d=parseISO(iso);
    const dayTasks=tasks.filter(t=>t.date===iso).sort((a,b)=>PRIO_RANK(a.prio)-PRIO_RANK(b.prio));
    const section=document.createElement('div');
    section.className='week-day-section';
    const isToday=iso===today;
    const isPast=diffDays(iso,today)<0;
    const badgeClass=isToday?'hoy':isPast?'past':'fut';
    section.innerHTML=`
      <div class="wds-header">
        <div class="wds-badge ${badgeClass}">${d.getDate()}</div>
        <div class="wds-info">
          <div class="wds-name${isToday?' hoy':''}">${WK[d.getDay()]}${isToday?' — Hoy':''}</div>
          <div class="wds-count">${dayTasks.length?dayTasks.length+' '+(dayTasks.length===1?'tarea':'tareas'):'Sin tareas'}</div>
        </div>
      </div>
      <div class="wds-sep"></div>`;
    if(dayTasks.length){
      anyTask=true;
      dayTasks.forEach(t=>section.appendChild(makeCard(t,isPast&&!t.done)));
    } else {
      section.innerHTML+=`<div style="padding:0 0 12px;font-size:13px;color:var(--txt4)">Día libre</div>`;
    }
    scr.appendChild(section);
  }
}

// ── Vista MES ──
function renderMonthView(){
  const today=isoToday();
  const scr=$('scroll');
  scr.innerHTML='';
  const now=new Date(); now.setDate(1); now.setMonth(now.getMonth()+monthOffset);
  const year=now.getFullYear(), month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  const wrap=document.createElement('div');
  wrap.className='month-view';
  wrap.innerHTML=`
    <div class="month-nav">
      <button class="month-nav-btn" id="prevMonth" aria-label="Mes anterior"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="month-nav-title">${MES_LARGO[month].charAt(0).toUpperCase()+MES_LARGO[month].slice(1)} ${year}</span>
      <button class="month-nav-btn" id="nextMonth" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="month-cal">
      <div class="mc-wk">${['L','M','X','J','V','S','D'].map(d=>`<div class="mc-wk-label">${d}</div>`).join('')}</div>
      <div id="mcGrid"></div>
    </div>
    <div class="month-tasks" id="monthTasks"></div>`;
  scr.appendChild(wrap);

  // Construir grilla
  const grid=$('mcGrid');
  let cells=[];
  const startDay=(firstDay===0?7:firstDay)-1; // lunes=0
  for(let i=startDay-1;i>=0;i--) cells.push({day:daysInPrev-i,curr:false});
  for(let i=1;i<=daysInMonth;i++) cells.push({day:i,curr:true});
  while(cells.length%7!==0) cells.push({day:cells.length-daysInMonth-startDay+1,curr:false});

  for(let r=0;r<cells.length/7;r++){
    const row=document.createElement('div'); row.className='mc-row';
    for(let c=0;c<7;c++){
      const cell=cells[r*7+c];
      const iso=cell.curr?`${year}-${p2(month+1)}-${p2(cell.day)}`:null;
      const isToday=iso===today;
      const isSel=iso===selDate;
      const cTasks=iso?tasks.filter(t=>t.date===iso):[];
      const div=document.createElement('div');
      div.className='mc-cell'+(cell.curr?'':' other-month')+(isToday?' hoy':'')+(isSel?' sel-day':'');
      div.setAttribute('aria-label', iso?`${cell.day} de ${MES_LARGO[month]}${isToday?' hoy':''}${isSel?' seleccionado':''}` :'');
      const dots=cTasks.slice(0,3).map(t=>`<div class="mc-dot" style="background:${PRIO_COLORS[t.prio]}"></div>`).join('');
      div.innerHTML=`<span class="mc-num">${cell.day}</span><div class="mc-dots">${dots}</div>`;
      if(iso){ div.addEventListener('click',()=>{ selDate=iso; renderMonthView(); }); }
      row.appendChild(div);
    }
    grid.appendChild(row);
  }

  // Tareas del día seleccionado
  const mt=$('monthTasks');
  const selTasks=tasks.filter(t=>t.date===selDate).sort((a,b)=>PRIO_RANK(a.prio)-PRIO_RANK(b.prio));
  const sd=parseISO(selDate);
  mt.innerHTML=`<div class="mt-header">${WK[sd.getDay()]} ${sd.getDate()} de ${MES_LARGO[sd.getMonth()]}</div>`;
  if(!selTasks.length){
    mt.innerHTML+=emptyHTML('Sin tareas','Toca una fecha para ver sus tareas.');
  } else {
    selTasks.forEach(t=>mt.appendChild(makeCard(t,diffDays(selDate,today)<0&&!t.done)));
  }

  $('prevMonth').addEventListener('click',()=>{ monthOffset--; render(); });
  $('nextMonth').addEventListener('click',()=>{ monthOffset++; render(); });
}

// ── Tarjeta tarea ──
function makeCard(t, isOverdue){
  const el=document.createElement('article');
  el.className=`task-card p-${t.prio}${t.done?' done':''}${isOverdue&&!t.done?' overdue':''}`;
  el.innerHTML=`
    <div class="tc-top">
      <button class="tc-check" aria-label="${t.done?'Marcar pendiente':'Marcar completada'}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="tc-body">
        <div class="tc-title"></div>
        ${t.desc?`<div class="tc-desc"></div>`:''}
        <div class="tc-footer">
          <span class="tag tag-${t.prio}">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>
            ${PRIO_NAMES[t.prio]}
          </span>
          ${isOverdue&&!t.done?`<span class="tag tag-red">Vencida</span>`:''}
        </div>
      </div>
      <div class="tc-actions">
        <button class="tc-act edit" aria-label="Editar"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="tc-act del" aria-label="Eliminar"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
      </div>
    </div>`;
  el.querySelector('.tc-title').textContent=t.title;
  if(t.desc) el.querySelector('.tc-desc').textContent=t.desc;
  el.querySelector('.tc-check').addEventListener('click',e=>{ e.stopPropagation(); toggleDone(t.id); });
  el.querySelector('.edit').addEventListener('click',e=>{ e.stopPropagation(); openEdit(t.id); });
  el.querySelector('.del').addEventListener('click',e=>{ e.stopPropagation(); openConfirm(t.id,t.title); });
  return el;
}

function emptyHTML(title,sub){
  return `<div class="empty">
    <div class="empty-icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg></div>
    <h3>${title}</h3><p>${sub}</p>
  </div>`;
}

// ── Acciones ──
function toggleDone(id){
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  showToast(t.done?'Tarea completada ✓':'Marcada como pendiente');
  render();
}
function deleteTask(id){
  tasks=tasks.filter(x=>x.id!==id);
  showToast('Tarea eliminada');
  render();
}

// ── Sheet Nueva/Editar ──
function openNew(){
  editId=null;
  $('sheetTitle').textContent='Nueva tarea';
  $('saveBtn').textContent='Agregar tarea';
  $('fTitulo').value='';
  $('fDesc').value='';
  $('fFecha').value=selDate;
  setPrio('green');
  openSheet('taskSheet');
  setTimeout(()=>$('fTitulo').focus(),350);
}
function openEdit(id){
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  editId=id;
  $('sheetTitle').textContent='Editar tarea';
  $('saveBtn').textContent='Guardar cambios';
  $('fTitulo').value=t.title;
  $('fDesc').value=t.desc;
  $('fFecha').value=t.date;
  setPrio(t.prio);
  openSheet('taskSheet');
}
function setPrio(p){
  curPrio=p;
  qsa('.prio-btn').forEach(b=>{ b.classList.toggle('sel',b.dataset.prio===p); b.setAttribute('aria-pressed',b.dataset.prio===p); });
}
qsa('.prio-btn').forEach(b=>b.addEventListener('click',()=>setPrio(b.dataset.prio)));
$('saveBtn').addEventListener('click',()=>{
  const title=$('fTitulo').value.trim();
  const date=$('fFecha').value;
  if(!title){ showToast('Escribe un título'); $('fTitulo').focus(); return; }
  if(!date){ showToast('Elige una fecha'); $('fFecha').focus(); return; }
  if(editId){
    const t=tasks.find(x=>x.id===editId);
    if(t){ t.title=title; t.desc=$('fDesc').value.trim(); t.date=date; t.prio=curPrio; }
    showToast('Cambios guardados');
  } else {
    tasks.push({id:nextId++,title,desc:$('fDesc').value.trim(),date,prio:curPrio,done:false});
    showToast('Tarea agregada');
  }
  closeSheet('taskSheet');
  render();
});
$('sheetClose').addEventListener('click',()=>closeSheet('taskSheet'));
$('fabBtn').addEventListener('click',openNew);

// ── Confirm delete ──
function openConfirm(id,name){
  deleteId=id;
  $('cs-sub').textContent=`"${name}" se eliminará definitivamente.`;
  openSheet('confirmSheet');
}
$('cs-del').addEventListener('click',()=>{ if(deleteId){ deleteTask(deleteId); deleteId=null; } closeSheet('confirmSheet'); });
$('cs-cancel').addEventListener('click',()=>closeSheet('confirmSheet'));

// ── Sheet helpers ──
function openSheet(id){
  $(id).classList.add('open');
  // iOS: evitar que el teclado mueva la pantalla
  document.documentElement.style.setProperty('overflow','hidden');
  document.body.style.overflow = 'hidden';
  document.body.style.touchAction = 'none';
  // Asegurar que el sheet-bg esté siempre al fondo del viewport
  const bg = $(id);
  bg.style.top = '0';
  bg.style.bottom = '0';
}
function closeSheet(id){
  $(id).classList.remove('open');
  document.documentElement.style.removeProperty('overflow');
  document.body.style.overflow = '';
  document.body.style.touchAction = '';
}
document.querySelectorAll('.sheet-bg').forEach(bg=>{
  bg.addEventListener('click',e=>{ if(e.target===bg) closeSheet(bg.id); });
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet('taskSheet'); closeSheet('confirmSheet'); }});

// ── Vista switcher ──
qsa('.vsw-btn').forEach(b=>b.addEventListener('click',()=>{
  view=b.dataset.view;
  qsa('.vsw-btn').forEach(x=>{ x.classList.toggle('act',x===b); x.setAttribute('aria-pressed',x===b); });
  render();
}));

// ── Toast ──
let toastTimer;
function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// ── Notificaciones 1 día antes ──────────────────────────────
function solicitarPermiso(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

function checkAlertas(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const manana = addDays(isoToday(), 1);
  const pendientes = tasks.filter(t => t.date === manana && !t.done);
  if(!pendientes.length) return;
  const nombres = pendientes.map(t => t.title).join(', ');
  const n = new Notification('📋 Mi Planificador — Mañana vence', {
    body: `Tienes ${pendientes.length} tarea${pendientes.length>1?'s':''} para mañana: ${nombres}`,
    icon: document.querySelector('link[rel="apple-touch-icon"]')?.href || '',
    badge: document.querySelector('link[rel="icon"]')?.href || '',
    tag: 'miplanner-alert',
    renotify: false,
  });
  setTimeout(() => n.close(), 8000);
}

// Banner in-app de aviso (para cuando no hay permisos de notificación push)
function checkAlertaInApp(){
  const manana = addDays(isoToday(), 1);
  const pendientes = tasks.filter(t => t.date === manana && !t.done);
  const banner = $('alertBanner');
  if(!banner) return;
  if(pendientes.length){
    const nombres = pendientes.slice(0,2).map(t=>t.title).join(', ') + (pendientes.length>2 ? ` y ${pendientes.length-2} más` : '');
    $('alertText').textContent = `⏰ Mañana vence${pendientes.length>1?'n':''}: ${nombres}`;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

// ── Init ──
solicitarPermiso();
// Check alertas push al cargar (si ya tiene permiso)
setTimeout(checkAlertas, 1500);
// Check diario
setInterval(checkAlertas, 3600000);
render();
</script>
<canvas id="circuit" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.35"></canvas>
<script>
(function(){
  const cv=document.getElementById('circuit');
  const ctx=cv.getContext('2d');
  let W,H,nodes=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;init()}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function init(){
    nodes=[];
    const count=Math.floor((W*H)/22000);
    for(let i=0;i<count;i++){
      nodes.push({x:rnd(0,W),y:rnd(0,H),
        vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,
        r:rnd(1.5,3),pulse:Math.random()*Math.PI*2});
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const t=Date.now()/1000;
    // Draw connecting lines
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){
          ctx.strokeStyle=`rgba(0,200,255,${(1-d/130)*.22})`;
          ctx.lineWidth=.6;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x,nodes[i].y);
          // L-shaped circuit path
          const mx=nodes[i].x+(nodes[j].x-nodes[i].x)*.5;
          ctx.lineTo(mx,nodes[i].y);
          ctx.lineTo(mx,nodes[j].y);
          ctx.lineTo(nodes[j].x,nodes[j].y);
          ctx.stroke();
        }
      }
    }
    // Draw nodes
    for(let n of nodes){
      const pulse=.5+.5*Math.sin(t*1.2+n.pulse);
      ctx.fillStyle=`rgba(0,200,255,${.25+pulse*.35})`;
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r*(1+pulse*.4),0,Math.PI*2);
      ctx.fill();
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1;
      if(n.y<0||n.y>H)n.vy*=-1;
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();
  draw();
})();
</script>
