<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --blue:#00C8FF;
  --blue2:#0090FF;
  --green:#00E676;
  --bg:#0A0A0F;
}
html,body{
  height:100%;width:100%;
  font-family:var(--font);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(0,200,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,255,.07) 1px,transparent 1px),
    linear-gradient(rgba(0,200,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,255,.025) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,20px 20px,20px 20px;
  color:#F0F4FF;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Canvas circuit ── */
#circuit{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}

/* ── Wrapper ── */
.page{
  position:relative;z-index:1;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,24px) 20px env(safe-area-inset-bottom,24px);
}

/* ── Logo / icono ── */
.logo-wrap{
  width:110px;height:110px;border-radius:28px;
  background:linear-gradient(145deg,#0E1A2B,#0A1018);
  border:1.5px solid rgba(0,200,255,.3);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;
  box-shadow:
    0 0 0 1px rgba(0,200,255,.1),
    0 0 30px rgba(0,200,255,.2),
    0 8px 32px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.06);
  animation:pulse 3s ease-in-out infinite;
  overflow:hidden;
  padding:10px;
}
.logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:18px;display:block}
@keyframes pulse{
  0%,100%{box-shadow:0 0 30px rgba(0,200,255,.15),inset 0 1px 0 rgba(255,255,255,.05)}
  50%{box-shadow:0 0 60px rgba(0,200,255,.3),inset 0 1px 0 rgba(255,255,255,.08)}
}

/* ── Texto ── */
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--blue);margin-bottom:10px;opacity:.9;
}
h1{
  font-size:clamp(2.4rem,8vw,3.8rem);font-weight:700;
  letter-spacing:-.04em;line-height:1;
  text-align:center;margin-bottom:14px;
}
h1 span{
  background:linear-gradient(135deg,var(--blue),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{
  font-size:clamp(.95rem,2.5vw,1.1rem);color:#8892AA;
  text-align:center;line-height:1.6;max-width:340px;margin-bottom:40px;
}

/* ── Badges feature ── */
.features{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:44px;width:100%;max-width:400px;padding:0 8px;width:100%;max-width:400px;
}
.feat{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:999px;
  border:1px solid rgba(0,200,255,.15);
  background:rgba(0,200,255,.06);
  font-size:12px;white-space:nowrap;font-weight:500;color:#8892AA;
}
.feat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fd-blue{background:var(--blue)}
.fd-green{background:var(--green)}
.fd-orange{background:#FF9F43}
.fd-red{background:#FF4560}
.fd-purple{background:#C77DFF}

/* ── CTA Button ── */
.cta{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 36px;border-radius:16px;
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#fff;font-size:1rem;font-weight:600;letter-spacing:-.01em;
  text-decoration:none;
  box-shadow:0 0 0 1px rgba(0,200,255,.3),0 8px 32px rgba(0,200,255,.35);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease);
  position:relative;overflow:hidden;
}
.cta::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,transparent 60%);
  pointer-events:none;
}
.cta:hover{
  transform:translateY(-2px);
  box-shadow:0 0 0 1px rgba(0,200,255,.4),0 12px 40px rgba(0,200,255,.5);
  filter:brightness(1.05);
}
.cta:active{transform:translateY(0) scale(.97)}
.cta svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2;fill:none;flex-shrink:0}

/* ── iPhone mockup hint ── */
.hint{
  margin-top:36px;font-size:12px;color:#5A6478;
  display:flex;align-items:center;gap:8px;text-align:center;line-height:1.5;
}
.hint svg{width:14px;height:14px;stroke:#5A6478;stroke-width:1.8;fill:none;flex-shrink:0}

/* ── Footer ── */
footer{
  position:absolute;bottom:max(20px,env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;
  font-size:11px;color:#3A4255;letter-spacing:.02em;
}
footer a{color:#3A4255;text-decoration:none}
footer a:hover{color:var(--blue)}
</style>
</head>

<script>
(function(){
  const cv=document.getElementById('circuit');
  const ctx=cv.getContext('2d');
  let W,H,nodes=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;init()}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function init(){
    nodes=[];
    const count=Math.floor((W*H)/18000);
    for(let i=0;i<count;i++){
      nodes.push({x:rnd(0,W),y:rnd(0,H),
        vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,
        r:rnd(1.5,3),pulse:Math.random()*Math.PI*2});
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const t=Date.now()/1000;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<140){
          ctx.strokeStyle=`rgba(0,200,255,${(1-d/140)*.2})`;
          ctx.lineWidth=.6;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x,nodes[i].y);
          const mx=nodes[i].x+(nodes[j].x-nodes[i].x)*.5;
          ctx.lineTo(mx,nodes[i].y);
          ctx.lineTo(mx,nodes[j].y);
          ctx.lineTo(nodes[j].x,nodes[j].y);
          ctx.stroke();
        }
      }
    }
    for(let n of nodes){
      const p=.5+.5*Math.sin(t*1.1+n.pulse);
      ctx.fillStyle=`rgba(0,200,255,${.2+p*.4})`;
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r*(1+p*.5),0,Math.PI*2);
      ctx.fill();
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1;
      if(n.y<0||n.y>H)n.vy*=-1;
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();draw();
})();
</script>
